<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursos Inmath · 503</title>
<style>
  :root{ --tinta:#16261F; --muted:#55625B; --pino:#3B6FF5; --sol:#F4A62A; --crema:#FBF8F1; --linea:#EAE3D4; --alerta:#C0392B; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--crema);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--tinta)}
  .escena{position:fixed;inset:0;display:grid;place-items:center;padding:24px}
  .escena::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(var(--linea) 1px,transparent 1px),linear-gradient(90deg,var(--linea) 1px,transparent 1px);
    background-size:34px 34px;-webkit-mask-image:radial-gradient(120% 90% at 50% 40%,#000 25%,transparent 75%);
    mask-image:radial-gradient(120% 90% at 50% 40%,#000 25%,transparent 75%);opacity:.6}
  /* halo de alerta tenue, sólo abajo — el logo conserva su gradiente de marca */
  .escena::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;
    background:radial-gradient(60% 100% at 50% 100%,rgba(192,57,43,.10),transparent 70%);pointer-events:none}
  .stage{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:24px;max-width:460px}
  .tile{width:76px;height:76px;border-radius:22px;background:linear-gradient(120deg,var(--pino),#8B6FF0);
    display:grid;place-items:center;box-shadow:0 18px 40px rgba(14,90,78,.28)}
  /* la curva se rompe: tramo dibujado + hueco + cola plana */
  .rota{stroke-dasharray:44 10 8 40;}
  .fantasma{stroke-dasharray:100;stroke-dashoffset:60;opacity:.4;animation:reintento 5s ease-in-out infinite}
  @keyframes reintento{0%{stroke-dashoffset:100;opacity:0}30%{stroke-dashoffset:62;opacity:.45}55%{stroke-dashoffset:62;opacity:.45}70%{opacity:0}100%{opacity:0}}
  .meta-hueca{animation:vibra 5s ease-in-out infinite}
  @keyframes vibra{0%,100%{transform:translate(0,0)}50%{transform:translate(1px,-1px)}}
  .pill{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--alerta);background:#FBEAE7;padding:8px 14px;border-radius:999px}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--alerta)}
  h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:16px}
  p{color:var(--muted);font-size:14.5px;line-height:1.55;margin-top:8px}
  .retry{margin-top:6px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="escena">
  <div class="stage">
    <div class="tile" aria-hidden="true">
      <svg width="50" height="50" viewBox="0 0 48 48">
        <g stroke="#fff" stroke-opacity=".22" stroke-width="1"><line x1="10" y1="12" x2="10" y2="38"/><line x1="10" y1="38" x2="40" y2="38"/></g>
        <path d="M10 34 C 17 33, 20 28, 25 24 S 34 14, 39 11" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="10" cy="34" r="2.4" fill="#fff"/><circle cx="39" cy="11" r="4.2" fill="#fff"/><circle cx="39" cy="11" r="1.9" fill="#F4A62A"/>
      </svg>
    </div>
    <svg viewBox="0 0 340 150" style="width:300px;height:132px" aria-hidden="true">
      <defs><linearGradient id="g" x1="20" y1="130" x2="320" y2="20" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#3B6FF5"/><stop offset="1" stop-color="#F4A62A"/></linearGradient></defs>
      <g stroke="#EAE3D4" stroke-width="1"><line x1="30" y1="14" x2="30" y2="126"/><line x1="30" y1="126" x2="320" y2="126"/><line x1="30" y1="70" x2="320" y2="70"/></g>
      <!-- intento fantasma de reconexión -->
      <path class="fantasma" pathLength="100" d="M40 116 C 90 110, 120 92, 150 76 S 220 46, 250 34 T 320 20" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-linecap="round"/>
      <!-- curva rota + cola plana -->
      <path class="rota" pathLength="100" d="M40 116 C 90 110, 120 92, 150 76" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
      <path d="M175 96 L 320 96" fill="none" stroke="#D9D0BD" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8"/>
      <circle cx="40" cy="116" r="3.4" fill="#3B6FF5"/>
      <circle class="meta-hueca" cx="320" cy="96" r="6" fill="var(--crema)" stroke="#C0392B" stroke-width="3"/>
    </svg>
    <div>
      <span class="pill">Error · 503</span>
      <h1>Servicio no disponible</h1>
      <p>Estamos teniendo un problema temporal en Cursos Inmath. Ya estamos trabajando en ello; intenta de nuevo en un momento.</p>
      <div class="retry">Reintentando conexión…</div>
    </div>
  </div>
</div>
</body>
</html>

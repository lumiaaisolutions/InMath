<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursos Inmath · Cargando</title>
<style>
  :root{ --tinta:#16261F; --muted:#55625B; --pino:#3B6FF5; --sol:#F4A62A; --crema:#FBF8F1; --linea:#EAE3D4; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--crema);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--tinta)}
  .escena{position:fixed;inset:0;display:grid;place-items:center}
  .escena::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(var(--linea) 1px,transparent 1px),linear-gradient(90deg,var(--linea) 1px,transparent 1px);
    background-size:34px 34px;-webkit-mask-image:radial-gradient(120% 90% at 50% 40%,#000 25%,transparent 75%);
    mask-image:radial-gradient(120% 90% at 50% 40%,#000 25%,transparent 75%);opacity:.7}
  .stage{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:28px}
  .tile{width:80px;height:80px;border-radius:22px;background:linear-gradient(120deg,var(--pino),#8B6FF0);
    display:grid;place-items:center;box-shadow:0 18px 40px rgba(14,90,78,.28);animation:respira 3.2s ease-in-out infinite}
  @keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  .curva{stroke-dasharray:100;stroke-dashoffset:100;animation:dibujar 2.6s cubic-bezier(.6,.05,.2,1) infinite}
  @keyframes dibujar{0%{stroke-dashoffset:100}50%{stroke-dashoffset:0}82%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
  .meta-pt{transform-origin:center;transform-box:fill-box;animation:latido 2.6s ease-in-out infinite}
  @keyframes latido{0%,42%{opacity:.25;transform:scale(.6)}58%{opacity:1;transform:scale(1)}100%{opacity:1}}
  .marca{font-size:15px;font-weight:700;letter-spacing:.01em}
  .marca span{color:var(--pino)}
  .sub{margin-top:10px;font-size:12px;color:var(--muted);letter-spacing:.32em;text-transform:uppercase}
  .puntos{display:inline-flex;gap:7px;margin-top:16px}
  .puntos i{width:6px;height:6px;border-radius:50%;background:linear-gradient(120deg,var(--pino),#8B6FF0);animation:pulso 1.4s ease-in-out infinite}
  .puntos i:nth-child(2){animation-delay:.18s}.puntos i:nth-child(3){animation-delay:.36s}
  @keyframes pulso{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.curva{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="escena">
  <div class="stage">
    <div class="tile" aria-hidden="true">
      <svg width="52" height="52" viewBox="0 0 48 48">
        <g stroke="#fff" stroke-opacity=".22" stroke-width="1"><line x1="10" y1="12" x2="10" y2="38"/><line x1="10" y1="38" x2="40" y2="38"/></g>
        <path d="M10 34 C 17 33, 20 28, 25 24 S 34 14, 39 11" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="10" cy="34" r="2.4" fill="#fff"/><circle cx="39" cy="11" r="4.2" fill="#fff"/><circle cx="39" cy="11" r="1.9" fill="#F4A62A"/>
      </svg>
    </div>
    <svg viewBox="0 0 340 180" style="width:320px;height:170px" aria-label="Cargando">
      <defs><linearGradient id="g" x1="20" y1="150" x2="320" y2="30" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#3B6FF5"/><stop offset="1" stop-color="#F4A62A"/></linearGradient></defs>
      <g stroke="#EAE3D4" stroke-width="1"><line x1="30" y1="20" x2="30" y2="150"/><line x1="30" y1="150" x2="320" y2="150"/>
        <line x1="30" y1="110" x2="320" y2="110"/><line x1="30" y1="70" x2="320" y2="70"/></g>
      <path class="curva" pathLength="100" d="M40 138 C 90 132, 120 112, 150 92 S 220 58, 250 44 T 320 26"
        fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
      <circle class="meta-pt" cx="320" cy="26" r="6.5" fill="#fff" stroke="#F4A62A" stroke-width="3.5"/>
    </svg>
    <div>
      <div class="marca">Cursos <span>Inmath</span></div>
      <div class="sub">Cargando</div>
      <div class="puntos"><i></i><i></i><i></i></div>
    </div>
  </div>
</div>
</body>
</html>
